# ---- Tray items that are not part of Plasma ------------------------------------------------------------------------

# KeePassXC's own tray glyphs (installed with its Flatpak): a white key in a shield, light and dark, locked or not
[[group]]
id = "keepassxc-tray"
context = "status"
sizes = [16, 22, 24, 32]
glyph = true
any-size = true
hue = "green"
names = ["org.keepassxc.KeePassXC-monochrome-*"]

# ---- Applications ----------------------------------------------------------------------------------------------------

# name is the icon name the desktop file (or the window) asks for; aliases are more names for the same icon. source
# says where the picture comes from when that is another name, files names picture files, themes the source themes to
# look in before the others (the official icon of an app is in hicolor or pixmaps, a Breeze style one in the first
# theme). Sizes default to 16, 22, 24, 32, 48, 64, 128 and 256.

