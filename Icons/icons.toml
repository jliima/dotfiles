hue = "magenta"
names = ["kdeconnect*", "smartphone*", "drive-removable-media*", "device-notifier*", "media-eject",
         "media-eject-symbolic", "input-keyboard", "input-keyboard-symbolic", "input-caps-on*", "input-num-on*",
         "input-touchpad-*", "touchpad_*", "printer", "printer-symbolic", "printer-error*", "camera-on*", "camera-off*",
         "camera-ready*", "video-display", "video-display-symbolic", "rotation-*"]

[[group]]
id = "media"
