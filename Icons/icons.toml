names = ["notification*", "notifications*", "preferences-system-notifications*", "mail-unread*"]

[[group]]
id = "clipboard"
context = "status"
sizes = [16, 22, 24, 32]
glyph = true
hue = "violet"
names = ["klipper*", "edit-paste", "edit-paste-symbolic", "edit-clear-history*"]

[[group]]
id = "devices"
context = "status"
sizes = [16, 22, 24, 32]
glyph = true
hue = "magenta"
names = ["kdeconnect*", "smartphone*", "drive-removable-media*", "device-notifier*", "media-eject",
         "media-eject-symbolic", "input-keyboard", "input-keyboard-symbolic", "input-caps-on*", "input-num-on*",
         "input-touchpad-*", "touchpad_*", "printer", "printer-symbolic", "printer-error*", "camera-on*", "camera-off*",
         "camera-ready*", "video-display", "video-display-symbolic", "rotation-*"]

[[group]]
id = "media"
context = "status"
sizes = [16, 22, 24, 32]
