# What scripts/kde/icon-sets/icon-sets.py builds: two icon themes per Themer theme and variant, recolored with gowall.
#
#   monochrome/<Theme>-Monochrome[-Light]/   two tones: the grounds (bg, surface, line) and the accent (blue in Pare)
#   colorful/<Theme>-Colorful[-Light]/       every color of the theme
#
# Each result is an XDG icon theme (index.theme plus <context>/<size>/<name>.png) that inherits the base themes, so only
# the icons listed here change. Link it into ~/.local/share/icons (the dotfiles do, through .local/share/icons/) and
# select it with Themer's [icons] table or in System Settings.

# Where the original icons come from, in this order (icon theme folder names, searched in the usual icon folders).
# The same list is what the built themes inherit.
source-themes = ["Breeze Chameleon Dark", "breeze-dark", "breeze", "hicolor", "pixmaps"]

# The palette gowall maps every pixel to, as Themer token names (a * matches any text; {accent} is the hue of the
# theme's accent: blue for Pare, orange for Aphelion). Palette colors are the only colors in a built icon.
[palette.monochrome]
tokens = ["bg-deep", "bg-sunken", "bg", "surface", "surface-raised", "surface-hover", "surface-active", "line",
          "line-strong", "{accent}-soft", "{accent}-dim", "{accent}", "{accent}-bright"]

[palette.colorful]
tokens = ["bg-deep", "surface-raised", "surface-active", "line-strong", "text-faint", "text-muted", "text",
          "text-bright", "*-soft", "*-dim", "red", "red-bright", "orange", "orange-bright", "yellow",
          "yellow-bright", "green", "green-bright", "cyan", "cyan-bright", "blue", "blue-bright", "violet",
          "violet-bright", "magenta", "magenta-bright"]

# Breeze status and action icons are single glyphs colored by the color scheme through CSS classes. Before gowall maps
# them, each class is painted with one of these tokens (a hue name stands for the group's hue below).
[glyph.monochrome]
Text = "{accent}"
ButtonText = "{accent}"
ViewText = "{accent}"
Highlight = "{accent}-bright"
ButtonFocus = "{accent}-bright"
ViewFocus = "{accent}-bright"
PositiveText = "{accent}-bright"
NeutralText = "{accent}-bright"
NegativeText = "{accent}-bright"
Background = "surface-active"
ButtonBackground = "surface-active"
ViewBackground = "surface-active"

[glyph.colorful]
Text = "{hue}"
ButtonText = "{hue}"
ViewText = "{hue}"
Highlight = "blue"
ButtonFocus = "blue"
ViewFocus = "blue"
PositiveText = "green"
NeutralText = "orange"
NegativeText = "red"
Background = "surface-active"
ButtonBackground = "surface-active"
ViewBackground = "surface-active"

# ---- The right-hand panel: the system tray applets and the items in it ---------------------------------------------

# glyph = true: Breeze style single-color icons. names are globs over the icon names of the source themes; an icon is
# built at every size of the group the sources have (or can scale to). hue colors the group in the colorful set.

[[group]]
id = "audio"
context = "status"
sizes = [16, 22, 24, 32]
glyph = true
hue = "green"
names = ["audio-volume-*", "audio-on*", "audio-off*", "audio-ready*", "mic-*", "microphone-*",
         "audio-input-microphone*", "audio-headphones*", "audio-headset*", "audio-card*", "audio-speakers*"]

[[group]]
id = "network"
context = "status"
sizes = [16, 22, 24, 32]
glyph = true
hue = "cyan"
names = ["network-wired*", "network-wireless*", "network-vpn*", "network-flightmode-*", "network-offline",
         "network-unavailable", "network-limited", "network-connect*", "network-disconnect*",
         "network-workgroup*", "network-server*", "nm-*", "flightmode-*", "preferences-system-network*"]

[[group]]
id = "bluetooth"
context = "status"
sizes = [16, 22, 24, 32]
glyph = true
hue = "blue"
names = ["bluetooth*", "network-bluetooth*", "preferences-system-bluetooth*"]

[[group]]
