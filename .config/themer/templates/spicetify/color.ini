; Generated by Themer. Spicetify colors are hex without the leading #.
;
; text / subtext   main text, secondary text
; main             content ground
; main-elevated    popups, tooltips, context menus
; highlight        row hover
; highlight-elevated  pressed and active rows
; sidebar          library and navigation ground
; player           now playing bar
; card             cards
; selected-row     text of the selected row
; button           accent fills and links
; button-active    accent hover
; button-disabled  inactive controls
; tab-active       active filter chips
; notification     toasts
; misc             scrollbars, hairlines

[Base]
text                = {{ text | strip }}
subtext             = {{ text-muted | strip }}
main                = {{ bg | strip }}
main-elevated       = {{ surface-raised | strip }}
highlight           = {{ surface-hover | strip }}
highlight-elevated  = {{ surface-active | strip }}
sidebar             = {{ bg-sunken | strip }}
player              = {{ bg-deep | strip }}
card                = {{ surface | strip }}
shadow              = 000000
selected-row        = {{ text-bright | strip }}
button              = {{ accent | strip }}
button-active       = {{ accent-hover | strip }}
button-disabled     = {{ text-disabled | strip }}
tab-active          = {{ surface-active | strip }}
notification        = {{ surface-raised | strip }}
notification-error  = {{ danger | strip }}
equalizer           = {{ accent | strip }}
misc                = {{ line-strong | strip }}
