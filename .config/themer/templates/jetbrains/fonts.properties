# Rendered by Themer (target "JetBrains fonts"); the Themer reload plugin applies it at IDE start and on every
# `themer apply`. The sizes come from [jetbrains] in settings.toml and the screen profile.
editor.font={{ fonts.mono }}
editor.font.size={{ jetbrains.editor-font-size }}
ui.font={{ fonts.sans }}
ui.font.size={{ jetbrains.ui-font-size }}
