# Read on top of the shipped themer/targets.toml: a target with a shipped name replaces it, new names are added.

# ---- Chromium --------------------------------------------------------------------------------------------------------

# An unpacked theme extension: "Load unpacked" ~/.config/chromium/themer-theme once from chrome://extensions. Chromium
# applies a theme at start from a cached pack (<profile>/Cached Theme.pak), so the reload removes the packs of every
# profile and a change shows after a Chromium restart. A profile that registered the theme under its old folder name
# (~/.config/chromium/pywal-theme) picks it up again if a link of that name points at themer-theme.
# A theme extension colors the frame, tabs, toolbar, address bar and new tab page only; the rest of Chromium's UI
# (dialogs, menus, settings) is drawn from a palette it generates itself. The BrowserThemeColor policy would drive that
# palette, but it replaces the extension theme altogether, so it is not used.
[[target]]
name = "Chromium"
dotfiles = true
group = "chromium"
template = "chromium/manifest.json"
output = "~/.config/chromium/themer-theme/manifest.json"
reload = "rm -f ~/.config/chromium/*/'Cached Theme.pak'"

# ---- Claude Code -----------------------------------------------------------------------------------------------------

# Select it once with /theme ("custom:themer", or "theme" in settings.json). Claude Code watches ~/.claude/themes and
# restyles live. ~/.claude is synced by Syncthing, so the file is written there and not into the dotfiles.
[[target]]
name = "Claude Code"
group = "claude"
template = "claude-code/theme.json"
output = "~/.claude/themes/themer.json"

# ---- Claude desktop --------------------------------------------------------------------------------------------------

# The app reads theme.css through an app.asar patch (scripts/claude-desktop/patch.sh), which the reload checks and
# reinstalls after an apt upgrade replaced app.asar. Reload the Claude window (Ctrl+R) to see a change.
[[target]]
name = "Claude desktop"
group = "claude-desktop"
template = "claude-desktop/theme.css"
output = "~/.config/claude-desktop-theme/theme.css"
reload = "~/scripts/claude-desktop/patch.sh ensure"

# ---- Slack -----------------------------------------------------------------------------------------------------------

# The app reads theme.css through an app.asar patch (scripts/slack/patch.sh), which also watches the file, so an apply
# restyles the open window. The reload checks the patch and reinstalls it after an apt upgrade replaced app.asar.
[[target]]
name = "Slack"
group = "slack"
template = "slack/theme.css"
output = "~/.config/slack-theme/theme.css"
reload = "~/scripts/slack/patch.sh ensure"

# ---- Plasma panels ---------------------------------------------------------------------------------------------------

# Panel sizes that follow the UI font (the clock), so the screen profile changes them too. plasmashell only takes a new
# UI font when it starts, so the reload restarts it; that happens when the font size changed (a profile switch).
[[target]]
name = "Plasma panel fonts"
group = "kde"
template = "plasma/panels.js"
output = "~/.cache/themer/plasma/panels.js"
reload = """qdbus6 org.kde.plasmashell /PlasmaShell org.kde.PlasmaShell.evaluateScript "$(cat ~/.cache/themer/plasma/panels.js)" \
  >/dev/null && systemctl --user restart plasma-plasmashell.service"""

# ---- Desktop Dots -------------------------------------------------------------------------------------------------

# The look of the Desktop Dots widget (.local/share/plasma/plasmoids/com.jliima.desktopdots). The widget knows nothing
# about Themer: it follows this JSON file live, so a new theme or mode restyles the panel without a reload.
[[target]]
name = "Desktop Dots"
dotfiles = true
group = "desktopdots"
template = "desktopdots/config.json"
output = "~/.config/desktopdots/config.json"

# ---- Konsole ---------------------------------------------------------------------------------------------------------

# The shipped target, but written straight into ~/.local/share/konsole instead of the dotfiles: its font size follows
# the screen profile (settings.toml), which would otherwise change a tracked file on every dock and undock.
[[target]]
name = "Konsole profile"
group = "konsole"
template = "konsole/Themer.profile"
output = "~/.local/share/konsole/Themer.profile"

# ---- lnav ------------------------------------------------------------------------------------------------------------

# The theme is selected by "theme": "themer" in lnav/configs/installed/java-log-keymap.json; lnav reads it on start.
[[target]]
name = "lnav theme"
dotfiles = true
group = "lnav"
template = "lnav/theme.json"
output = "~/.config/lnav/configs/installed/themer.json"

[[target]]
name = "lnav Java log colors"
dotfiles = true
group = "lnav"
template = "lnav/java-log-colors.json"
output = "~/.config/lnav/formats/installed/java-log-colors.json"

# ---- nano ------------------------------------------------------------------------------------------------------------

# The syntax colors are ANSI names, so they follow the theme through the Konsole color scheme.
[[target]]
name = "nano syntax"
dotfiles = true
group = "nano"
template = "nano/themer.nanorc"
output = "~/.config/nano/themer.nanorc"

# Included after the system defaults so it takes over highlighting for Java, Shell, Python, CSS and XML.
[[target]]
name = "nano include"
group = "nano"
template = "nano/include.nanorc"
output = "~/.nanorc"
mode = "ensure-lines"

# ---- Vim and Neovim --------------------------------------------------------------------------------------------------

# The colorscheme for Neovim: editor, plugins (Telescope, blink.cmp, ...), Treesitter, LSP and Vim syntax groups. It is
# selected in init.lua (`colorscheme themer`). Neovim's folder is its own repo, so nothing is stowed. For plain Vim add
# a target with the same template and output ~/.vim/colors/themer.vim.
[[target]]
name = "Neovim colorscheme"
group = "vim"
template = "vim/themer.vim"
output = "~/.config/nvim/colors/themer.vim"

# ---- OBS Studio ------------------------------------------------------------------------------------------------------

# A Yami based theme (Settings > Appearance > Theme > Themer). Restart OBS after a theme or mode change.
[[target]]
name = "OBS Studio"
group = "obs"
template = "obs/theme.ovt"
output = "~/.var/app/com.obsproject.Studio/config/obs-studio/themes/Themer.ovt"

# ---- Obsidian --------------------------------------------------------------------------------------------------------

# Select the theme once in Settings > Appearance (or "cssTheme": "Themer" in appearance.json). Obsidian reloads the
# CSS when the file changes. The vault config folder is synced by Syncthing, so nothing is stowed.
[[target]]
name = "Obsidian theme"
group = "obsidian"
template = "obsidian/theme.css"
output = "~/Obsidian/.config/.obsidian-desktop/themes/Themer/theme.css"

[[target]]
name = "Obsidian theme manifest"
group = "obsidian"
template = "obsidian/manifest.json"
output = "~/Obsidian/.config/.obsidian-desktop/themes/Themer/manifest.json"

# Dark pages when exporting to PDF; enable the snippet in Settings > Appearance before exporting.
[[target]]
name = "Obsidian PDF export snippet"
group = "obsidian"
template = "obsidian/pdf-export-darkmode.css"
output = "~/Obsidian/.config/.obsidian-desktop/snippets/PDF-Export-Darkmode.css"

# ---- Spotify (Spicetify) ---------------------------------------------------------------------------------------------

# spicetify/config-xpui.ini is Spicetify's own file and not in the dotfiles (it writes its version and Spotify's into
# it on every run). The reload sets the settings this setup needs there, then re-applies the theme to Spotify without
# restarting it; restart Spotify to see a change. On a new machine: `themer apply --only spicetify --force`.
# After a Spotify update Spicetify's backup no longer matches and `spicetify apply` only warns; reinstall Spotify and
# run `spicetify backup apply` then.
# Spotify is launched as `spotify --disable-gpu-sandbox` (the GPU sandbox fails on kernel 7.0.0-38).
[[target]]
name = "Spicetify colors"
dotfiles = true
group = "spicetify"
template = "spicetify/color.ini"
output = "~/.config/spicetify/Themes/Themer/color.ini"
reload = """spicetify -q config current_theme Themer color_scheme '' inject_css 1 replace_colors 1 inject_theme_js 1 \
  sidebar_config 0 custom_apps marketplace; spicetify apply --no-restart"""

[[target]]
name = "Spicetify styles"
dotfiles = true
group = "spicetify"
template = "spicetify/user.css"
output = "~/.config/spicetify/Themes/Themer/user.css"

# ---- Discord (Vencord) -----------------------------------------------------------------------------------------------

# Enable "themer.theme.css" once in Vencord > Themes; Vencord reloads it when the file changes. Written against the
# current Discord class and variable names, not tested against every client version.
[[target]]
name = "Discord theme"
group = "discord"
template = "discord/theme.css"
output = "~/.config/Vencord/themes/themer.theme.css"

# ---- Telegram --------------------------------------------------------------------------------------------------------

# The reload zips the colors into Themer.tdesktop-theme. Apply it once in Telegram (open the file from a chat, or
# Settings > Chat Settings > Choose from file); re-applying it after a theme or mode change picks up the new colors.
[[target]]
name = "Telegram colors"
group = "telegram"
template = "telegram/colors.tdesktop-theme"
output = "~/.cache/themer/telegram/colors.tdesktop-theme"
reload = "cd ~/.cache/themer/telegram && rm -f Themer.tdesktop-theme && zip -q Themer.tdesktop-theme colors.tdesktop-theme"

# ---- fzf -------------------------------------------------------------------------------------------------------------

# Sourced by .config/zsh/.zshrc; new shells pick up a change.
[[target]]
name = "fzf colors"
group = "fzf"
template = "fzf/colors.sh"
output = "~/.cache/themer/fzf.sh"

# ---- Qt Creator ------------------------------------------------------------------------------------------------------

# A first guess, not tested: select "Themer" in Qt Creator > Preferences > Environment > Interface (theme) and
# "themer" under Text Editor > Font & Colors. Restart Qt Creator after a change.
[[target]]
name = "Qt Creator theme"
group = "qtcreator"
template = "qtcreator/theme.creatortheme"
output = "~/.config/QtProject/qtcreator/themes/themer.creatortheme"

[[target]]
name = "Qt Creator design tokens"
group = "qtcreator"
template = "qtcreator/theme.figmatokens"
output = "~/.config/QtProject/qtcreator/themes/themer.figmatokens"

[[target]]
name = "Qt Creator editor colors"
group = "qtcreator"
template = "qtcreator/colors.xml"
output = "~/.config/QtProject/qtcreator/styles/themer.xml"

# ---- Okular (Markdown) -----------------------------------------------------------------------------------------------

# The themed Markdown backend (the okular-markdown repo) reads this file when it opens a document; reopen the
# Markdown file to see a change. The first comment of the file names the Kate syntax theme for fenced code.
[[target]]
name = "Okular Markdown style"
group = "okular"
template = "okular/markdown.css"
output = "~/.config/okular-markdown/style.css"

# Okular multiplies text selections onto the page, so on a dark Markdown page they need a bright selection color
# (see the template). The reload selects the scheme in okularrc; Okular reads it at start.
[[target]]
name = "Okular color scheme"
group = "okular"
template = "okular/scheme.colors"
output = "~/.local/share/color-schemes/ThemerOkular.colors"
reload = "kwriteconfig6 --file okularrc --group UiSettings --key ColorScheme ThemerOkular"

# ---- Wireshark -------------------------------------------------------------------------------------------------------

# The color rules (colorfilters) are a whole file Themer owns, so they are stowed. The rule list, filters and order
# are the ones from Wireshark; only the colors come from the theme (Wireshark reads the file when it starts, or View >
# Reload Color Rules). The preferences file also holds machine data (an sshdump command), so only the color keys are
# merged into it: marked and ignored packets, Follow Stream and the display filter bar.
[[target]]
name = "Wireshark color rules"
dotfiles = true
group = "wireshark"
template = "wireshark/colorfilters"
output = "~/.config/wireshark/colorfilters"

[[target]]
name = "Wireshark preference colors"
group = "wireshark"
template = "wireshark/preferences"
output = "~/.config/wireshark/preferences"
mode = "ensure-lines"
