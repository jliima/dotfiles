# Read on top of the shipped themer/targets.toml: a target with a shipped name replaces it, new names are added.

# Apps Themer has no template for yet (VS Code, Obsidian, IntelliJ, Spicetify, lnav, nano, vim, ...) still render
# from pywal templates. This file only changes when the theme or variant does; then run-pywal.py runs wal with the
# matching ~/.config/wal/colorschemes/<variant>/<theme>.json and every script in scripts/pywal/applications.
[[target]]
name = "pywal apps"
group = "pywal"
format = "pywal"
output = "~/.cache/themer/pywal-apps.json"
reload = "~/dotfiles/scripts/pywal/run-pywal.py"

# wal writes ~/.cache/wal itself (from the same pare.json, through the templates in ~/.config/wal/templates), so
# Themer's copies would only fight it on every apply.
[[target]]
name = "pywal colors.json"
enabled = false

[[target]]
name = "pywal colors.sh"
enabled = false

[[target]]
name = "pywal colors.css"
enabled = false

# JetBrains IDEs: ~/JetBrainsProjects/jetbrains-pywal-theme builds its UI theme and editor scheme from this
# pywal-format palette (dark or light follows the variant) and live reloads running IDEs.
[[target]]
name = "JetBrains IDEs"
group = "jetbrains"
format = "pywal"
output = "~/.cache/themer/jetbrains.json"
reload = "~/JetBrainsProjects/jetbrains-pywal-theme/apply.sh"

# ---- Chromium --------------------------------------------------------------------------------------------------------

# An unpacked theme extension: load ~/.config/chromium/themer-theme once from chrome://extensions. A change shows after
# a Chromium restart (the cached theme pack is removed so it is rebuilt).
[[target]]
name = "Chromium"
dotfiles = true
group = "chromium"
template = "chromium/manifest.json"
output = "~/.config/chromium/themer-theme/manifest.json"
reload = "rm -f ~/.config/chromium/themer-theme/'Cached Theme.pak'"

# ---- Claude Code -----------------------------------------------------------------------------------------------------

# Select it once with /theme ("custom:themer", or "theme" in settings.json). Claude Code watches ~/.claude/themes and
# restyles live. ~/.claude is synced by Syncthing, so the file is written there and not into the dotfiles.
[[target]]
name = "Claude Code"
group = "claude"
template = "claude-code/theme.json"
output = "~/.claude/themes/themer.json"

# ---- Claude desktop --------------------------------------------------------------------------------------------------

# The app reads theme.css through an app.asar patch (scripts/claude-desktop/patch.sh), which the reload checks and
# reinstalls after an apt upgrade replaced app.asar. Reload the Claude window (Ctrl+R) to see a change.
[[target]]
name = "Claude desktop"
group = "claude-desktop"
template = "claude-desktop/theme.css"
output = "~/.config/claude-desktop-theme/theme.css"
reload = "~/dotfiles/scripts/claude-desktop/patch.sh ensure"

# ---- lnav ------------------------------------------------------------------------------------------------------------

# The theme is selected by "theme": "themer" in lnav/configs/installed/java-log-keymap.json; lnav reads it on start.
[[target]]
name = "lnav theme"
dotfiles = true
group = "lnav"
template = "lnav/theme.json"
output = "~/.config/lnav/configs/installed/themer.json"

[[target]]
name = "lnav Java log colors"
dotfiles = true
group = "lnav"
template = "lnav/java-log-colors.json"
output = "~/.config/lnav/formats/installed/java-log-colors.json"

# ---- nano ------------------------------------------------------------------------------------------------------------

# The syntax colors are ANSI names, so they follow the theme through the Konsole color scheme.
[[target]]
name = "nano syntax"
dotfiles = true
group = "nano"
template = "nano/themer.nanorc"
output = "~/.config/nano/themer.nanorc"

# Included after the system defaults so it takes over highlighting for Java, Shell, Python, CSS and XML.
[[target]]
name = "nano include"
group = "nano"
template = "nano/include.nanorc"
output = "~/.nanorc"
mode = "ensure-lines"

# ---- Vim and Neovim --------------------------------------------------------------------------------------------------

# Only adds the colorscheme; run `:colorscheme themer` to use it. Neovim's folder is its own repo, so nothing is
# stowed. For plain Vim add a target with the same template and output ~/.vim/colors/themer.vim.
[[target]]
name = "Neovim colorscheme"
group = "vim"
template = "vim/themer.vim"
output = "~/.config/nvim/colors/themer.vim"
