# Read on top of the shipped themer/targets.toml: a target with a shipped name replaces it, new names are added.

# Apps Themer has no template for yet (VS Code, Obsidian, IntelliJ, Spicetify, lnav, nano, vim, ...) still render
# from pywal templates. This file only changes when the theme or variant does; then run-pywal.py runs wal with the
# matching ~/.config/wal/colorschemes/<variant>/<theme>.json and every script in scripts/pywal/applications.
[[target]]
name = "pywal apps"
group = "pywal"
format = "pywal"
output = "~/.cache/themer/pywal-apps.json"
reload = "~/dotfiles/scripts/pywal/run-pywal.py"

# wal writes ~/.cache/wal itself (from the same pare.json, through the templates in ~/.config/wal/templates), so
# Themer's copies would only fight it on every apply.
[[target]]
name = "pywal colors.json"
enabled = false

[[target]]
name = "pywal colors.sh"
enabled = false

[[target]]
name = "pywal colors.css"
enabled = false

# JetBrains IDEs: ~/JetBrainsProjects/jetbrains-pywal-theme builds its UI theme and editor scheme from this
# pywal-format palette (dark or light follows the variant) and live reloads running IDEs.
[[target]]
name = "JetBrains IDEs"
group = "jetbrains"
format = "pywal"
output = "~/.cache/themer/jetbrains.json"
reload = "~/JetBrainsProjects/jetbrains-pywal-theme/apply.sh"

# ---- Chromium --------------------------------------------------------------------------------------------------------

# An unpacked theme extension: load ~/.config/chromium/themer-theme once from chrome://extensions. A change shows after
# a Chromium restart (the cached theme pack is removed so it is rebuilt).
[[target]]
name = "Chromium"
dotfiles = true
group = "chromium"
template = "chromium/manifest.json"
output = "~/.config/chromium/themer-theme/manifest.json"
reload = "rm -f ~/.config/chromium/themer-theme/'Cached Theme.pak'"
