link = "#003399"
selection = "#80c8ff"
success = "#006622"
warning = "#7a4400"
danger = "#aa0000"
info = "#005588"
on-accent = "#00ffff"
syntax-keyword = "#005577"
syntax-string = "#660088"
syntax-comment = "#448888"
