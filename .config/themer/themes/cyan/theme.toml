# Cyan: a loud single-hue Themer theme.
# A loud single-hue novelty theme: it does not try to pass `themer check`.

[meta]
id = "cyan"
name = "Cyan"
description = "Everything in cyan, light only."
version = "1.0.0"
variants = ["light"]
default-variant = "light"

[fonts]
sans = "SF Pro"
mono = "Liga SFMono Nerd Font"
ui-weight = 500
title-weight = 600

[shape]
radius-xs = 4
radius-sm = 6
radius-md = 10
radius-lg = 14

[light]
bg-deep = "#00cccc"
bg-sunken = "#00e5e5"
bg = "#00ffff"
surface = "#99ffff"
surface-raised = "#e0ffff"
surface-hover = "#ccffff"
surface-active = "#66eeee"
line = "#00d4d4"
line-strong = "#00cccc"
text-bright = "#001a1a"
text = "#001a1a"
text-muted = "#266666"
text-subtle = "#3d8080"
text-faint = "#3d8080"
text-disabled = "#5a9999"
text-inverse = "#00ffff"
red = "#990000"
red-bright = "#cc0000"
green = "#005500"
green-bright = "#007700"
yellow = "#7a4400"
yellow-bright = "#996600"
blue = "#003388"
blue-bright = "#0044aa"
magenta = "#660088"
magenta-bright = "#880099"
cyan = "#005577"
cyan-bright = "#006688"
orange = "#892200"
violet = "#331988"
accent = "#005588"
accent-hover = "#003d66"
