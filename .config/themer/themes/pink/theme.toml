# Pink: a loud single-hue Themer theme.
# A loud single-hue novelty theme: it does not try to pass `themer check`.

[meta]
id = "pink"
name = "Pink"
description = "Everything in pink, light only."
version = "1.0.0"
variants = ["light"]
default-variant = "light"

[fonts]
sans = "SF Pro"
mono = "Liga SFMono Nerd Font"
ui-weight = 500
title-weight = 600

[shape]
radius-xs = 4
radius-sm = 6
radius-md = 10
radius-lg = 14

[light]
bg-deep = "#ff66a3"
bg-sunken = "#e6005c"
bg = "#ff0066"
surface = "#ff3385"
surface-raised = "#ff99bb"
surface-hover = "#ff66a3"
surface-active = "#ff2277"
line = "#cc0052"
line-strong = "#e6005c"
text-bright = "#1a0008"
text = "#1a0008"
text-muted = "#550019"
text-subtle = "#660022"
text-faint = "#660022"
text-disabled = "#882244"
text-inverse = "#ff0066"
red = "#880000"
red-bright = "#aa0000"
green = "#006600"
green-bright = "#008800"
yellow = "#553300"
