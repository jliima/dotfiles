# Themer settings that belong to this machine, not to a theme. Copied to ~/.config/themer/settings.toml.

# Theme used when no --theme is given and nothing has been applied yet.
default-theme = "pare"

[firefox]
# profile = "~/.mozilla/firefox/xxxxxxxx.default-release"   # set if detection picks the wrong profile

[dotfiles]
# Generated files that Themer owns (color schemes, Konsole schemes and profile, Kate themes, GTK css) are written
# into this folder at their path relative to ~, then linked with the stow command below. Your themes, templates,
# snippets and this file live in <dotfiles>/.config/themer. Merged config files (kdeglobals, kwinrc, katerc, darklyrc,
# konsolerc) are edited where they are; if you stow them yourself, Themer writes through the link.
enabled = true
# {dotfiles} and {home} are filled in. Leave empty ("") to skip stowing and run stow yourself.
stow = "stow --no-folding --dir={dotfiles} --target={home} ."

# Non-color settings that win over every theme on this machine, by table and key as in a theme.toml.
[overrides.kde]
# The Themer KWin decoration, built with decoration/build.sh from a Themer clone.
decoration-library = "themer"
decoration-theme = "Themer"
buttons-left = "M"
# The Themer Kvantum theme; its dark twin loads as kvantum-dark, so a mode toggle restyles running apps.
widget-style = "kvantum"
widget-style-dark = "kvantum-dark"

[overrides.window]
# KDE-Rounded-Corners draws the ring around every window here, so the decoration does not.
decoration-outline-width = 0
# Slightly larger window titles, one weight step below the themes' 600.
title-size = 13

[overrides.fonts]
title-weight = 500

# IntelliJ and the other JetBrains IDEs (the reload plugin applies them): 0 keeps the IDE's own UI font.
[overrides.jetbrains]
editor-font-size = 15
ui-font-size = 0

# Plasma scale per output, set by `themer screens --apply` (the themer-screens service runs it after every hotplug):
# everything at 100%, the desktop's 27" 1440p screens and the T14's 14" panel alike.
[screens]
DP-1 = 1.0
DP-2 = 1.0
eDP-1 = 1.0

# Screen profiles: overrides that apply while a matching screen is on, on top of the ones above. The first match wins;
# with none, the values above apply. The themer-screens service switches them on hotplug; `themer profile` shows them.
# The T14 docked to the 32" 4K at 100%: larger fonts everywhere, Firefox pages at 120%.
[[profile]]
name = "32-inch"
inches = [30, 40]

[profile.overrides.fonts]
ui-size = 12
small-size = 10
mono-size = 13
title-size = 12

[profile.overrides.window]
title-size = 16

[profile.overrides.firefox]
zoom = 1.2
ui-scale = 1.2

[profile.overrides.jetbrains]
editor-font-size = 18
ui-font-size = 16
